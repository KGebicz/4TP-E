# ============================================================
# application.properties - glowny plik konfiguracyjny Spring Boota
# Spring czyta go przy starcie aplikacji i na jego podstawie
# ustawia polaczenie z baza danych i zachowanie Hibernate.
# Linie zaczynajace sie od # to komentarze (Spring je ignoruje).
# ============================================================

# Nazwa aplikacji (pojawia sie m.in. w logach)
spring.application.name=demo

# --- Polaczenie z baza danych MySQL ---
# Adres bazy w formacie JDBC: jdbc:mysql://HOST:PORT/NAZWA_BAZY
#   localhost - baza dziala na tym samym komputerze
#   3306      - standardowy port MySQL
#   szkola    - nazwa bazy (musi istniec w MySQL!)
spring.datasource.url=jdbc:mysql://localhost:3306/szkola

# Login i haslo do bazy (tu: root bez hasla - tylko do nauki,
# w prawdziwym projekcie NIGDY nie uzywamy tak slabych danych)
spring.datasource.username=root
spring.datasource.password=

# --- Ustawienia JPA / Hibernate ---
# Co Hibernate robi z tabelami przy starcie:
#   update      - tworzy tabele, jesli jej nie ma, i dodaje brakujace
#                 kolumny (nie kasuje danych) - wygodne na lekcjach
#   create      - za kazdym razem tworzy tabele od nowa (kasuje dane!)
#   validate    - tylko sprawdza, czy tabele pasuja do klas
#   none        - nic nie robi
spring.jpa.hibernate.ddl-auto=update

# Wypisuje w konsoli zapytania SQL, ktore Hibernate wysyla do bazy
# (swietne do nauki: widac, co robi findAll(), save() itd.)
spring.jpa.show-sql=true
